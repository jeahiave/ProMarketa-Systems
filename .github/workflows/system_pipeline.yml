name: ProMarketa Systems

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  execute-data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install Project Dependencies
        run: uv sync

      - name: Execute Extraction (Generate Raw Data)
        run: uv run python 01_generate_data.py

      - name: Execute Transformation & Feature Engineering
        run: uv run python 02_transform_data.py

      - name: Execute Machine Learning Engine and XAI
        run: uv run python 03_train_models.py

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Archive Outputs to Google Drive
        run: |
          rclone copy . gdrive:promarketa-archive/ \
            --include "04_raw_marketing_data.parquet" \
            --include "05_engineered_marketing_data.parquet" \
            --include "06_ProMarketa_intel_data.parquet" \
            --include "07_champion_churn_model.pkl" \
            --include "08_clv_regressor_model.pkl" \
            --progress
